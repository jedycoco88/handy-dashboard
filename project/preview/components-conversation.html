<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:10px;}
  .conv{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-md);
        background:var(--bg-2);border:1px solid var(--border-2);}
  .conv.active{background:var(--primary-soft);border-color:var(--primary);}
  .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;
      font-size:13px;color:#fff;flex:none;position:relative;}
  .ch{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;
      display:grid;place-items:center;border:2px solid var(--bg-2);}
  .ch svg{width:9px;height:9px;color:#fff;}
  .mid{flex:1;min-width:0;}
  .nm{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--fg-1);}
  .pv{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .tm{font-family:var(--font-mono);font-size:11px;color:var(--fg-4);}
  .unread{background:var(--accent);color:var(--accent-fg);font-family:var(--font-mono);font-weight:700;
          font-size:10px;min-width:18px;height:18px;border-radius:var(--r-pill);display:grid;place-items:center;padding:0 5px;}
</style></head>
<body><div class="card">
  <div class="conv active">
    <span class="av" style="background:#7d4cdb">RC<span class="ch" style="background:var(--ch-messenger)"><i data-lucide="messages-square"></i></span></span>
    <div class="mid"><div class="nm">Rhea Cruz <span style="font-size:11px;font-weight:600;color:var(--stage-inquiry)">New Inquiry</span></div>
      <div class="pv">Hi po, magkano for deep cleaning ng 2BR condo?</div></div>
    <div class="rt"><span class="tm">4m</span><span class="unread">2</span></div>
  </div>
  <div class="conv">
    <span class="av" style="background:#0f766e">JM<span class="ch" style="background:var(--ch-whatsapp)"><i data-lucide="message-circle"></i></span></span>
    <div class="mid"><div class="nm">Jomar Reyes</div>
      <div class="pv">Sige po, book na po tayo for Tuesday 9am 👍</div></div>
    <div class="rt"><span class="tm">1h</span></div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
