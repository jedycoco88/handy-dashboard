<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);}
  .card{padding:26px 30px;display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:6px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-4);}
  .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg-1);font-size:46px;letter-spacing:-.02em;}
  .mid{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--accent);font-size:24px;}
  .id{font-family:var(--font-mono);color:var(--fg-2);font-size:14px;}
</style></head>
<body><div class="card">
  <div class="col"><span class="big">134</span><span class="meta">KPI · tabular · 700</span></div>
  <div class="col"><span class="mid ds-money">18,750</span><span class="meta">Money · ₱ · tnum</span></div>
  <div class="col"><span class="id">#HS-2041</span><span class="meta">Booking ID</span></div>
  <div class="col"><span class="id">4m ago</span><span class="meta">Relative time</span></div>
</div></body></html>
