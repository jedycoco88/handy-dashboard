<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--r-md);height:108px;border:1px solid var(--border-2);
      display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .n{font-size:12px;font-weight:600;color:var(--fg-1);}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head>
<body><div class="card">
  <div class="sw" style="background:var(--bg-0)"><span class="n">bg-0</span><span class="h">#090d16</span></div>
  <div class="sw" style="background:var(--bg-1)"><span class="n">bg-1</span><span class="h">#0f1422</span></div>
  <div class="sw" style="background:var(--bg-2)"><span class="n">bg-2</span><span class="h">#161d2f</span></div>
  <div class="sw" style="background:var(--bg-3)"><span class="n">bg-3</span><span class="h">#1d2638</span></div>
  <div class="sw" style="background:var(--bg-4)"><span class="n">bg-4</span><span class="h">#27324a</span></div>
</div></body></html>
