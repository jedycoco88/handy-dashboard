<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;gap:10px;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
      background:var(--bg-2);border:1px solid var(--border-2);}
  .ic svg{width:22px;height:22px;}
  .n{font-size:11px;font-weight:600;color:var(--fg-2);}
</style></head>
<body><div class="card">
  <div class="col"><div class="ic"><i data-lucide="messages-square" style="color:var(--ch-messenger)"></i></div><span class="n">Messenger</span></div>
  <div class="col"><div class="ic"><i data-lucide="message-square" style="color:var(--ch-sms)"></i></div><span class="n">SMS</span></div>
  <div class="col"><div class="ic"><i data-lucide="camera" style="color:var(--ch-instagram)"></i></div><span class="n">Instagram</span></div>
  <div class="col"><div class="ic"><i data-lucide="phone" style="color:var(--ch-viber)"></i></div><span class="n">Viber</span></div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
