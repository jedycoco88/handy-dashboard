<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);
       font-size:14px;font-weight:600;border-radius:var(--r-md);padding:9px 16px;
       border:1px solid transparent;cursor:pointer;}
  .btn svg{width:16px;height:16px;}
  .primary{background:var(--primary);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset;}
  .accent{background:var(--accent);color:var(--accent-fg);}
  .ghost{background:var(--bg-2);color:var(--fg-1);border-color:var(--border-2);}
  .subtle{background:transparent;color:var(--fg-2);}
  .danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(251,113,133,.3);}
  .focus{background:var(--primary);color:#fff;box-shadow:var(--glow-primary);}
  .ico{padding:9px;}
</style></head>
<body><div class="card">
  <div class="row">
    <button class="btn primary"><i data-lucide="plus"></i>New booking</button>
    <button class="btn accent"><i data-lucide="zap"></i>Assign HP</button>
    <button class="btn ghost"><i data-lucide="filter"></i>Filters</button>
    <button class="btn subtle">Cancel</button>
    <button class="btn danger"><i data-lucide="x"></i>Cancel booking</button>
    <button class="btn ghost ico"><i data-lucide="more-horizontal"></i></button>
  </div>
  <div class="row">
    <button class="btn focus"><i data-lucide="check"></i>Focused</button>
    <button class="btn primary" style="opacity:.45;cursor:not-allowed">Disabled</button>
    <button class="btn primary" style="transform:scale(.98);background:var(--primary-press)">Pressed</button>
    <button class="btn primary" style="background:var(--primary-hover)">Hover</button>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
