<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
  .grp{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--r-md);height:74px;border:1px solid var(--border-2);
      display:flex;flex-direction:column;justify-content:flex-end;padding:9px;}
  .n{font-size:12px;font-weight:700;}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.75;}
</style></head>
<body><div class="card">
  <div class="grp">
    <div class="sw" style="background:var(--primary);color:#fff"><span class="n">Primary</span><span class="h">#ff6000</span></div>
    <div class="sw" style="background:var(--primary-hover);color:#fff"><span class="n">Hover</span><span class="h">#ff7d33</span></div>
    <div class="sw" style="background:var(--primary-press);color:#fff"><span class="n">Press</span><span class="h">#d94e00</span></div>
    <div class="sw" style="background:var(--primary-soft);color:var(--primary)"><span class="n">Soft</span><span class="h">15% tint</span></div>
  </div>
  <div class="grp">
    <div class="sw" style="background:var(--accent);color:var(--accent-fg)"><span class="n">Accent</span><span class="h">#4d82e8</span></div>
    <div class="sw" style="background:var(--accent-hover);color:var(--accent-fg)"><span class="n">Hover</span><span class="h">#6a97ee</span></div>
    <div class="sw" style="background:var(--accent-soft);color:var(--accent)"><span class="n">Soft</span><span class="h">16% tint</span></div>
    <div class="sw" style="background:var(--brand-navy);color:#fff"><span class="n">Navy</span><span class="h">#003090</span></div>
  </div>
</div></body></html>
