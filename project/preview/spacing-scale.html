<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;}
  .bar{height:16px;background:var(--primary);border-radius:3px;}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:96px;}
</style></head>
<body><div class="card">
  <div class="row"><span class="lab">sp-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab">sp-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab">sp-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lab">sp-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab">sp-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab">sp-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lab">sp-12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lab">sp-16 · 64</span><div class="bar" style="width:64px"></div></div>
</div></body></html>
