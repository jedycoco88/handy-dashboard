<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;gap:12px;}
  .col{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .dot{width:100%;height:54px;border-radius:var(--r-md);border:1px solid var(--border-2);}
  .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);}
  .n{font-size:12px;font-weight:600;color:var(--fg-2);}
</style></head>
<body><div class="card">
  <div class="col"><div class="dot" style="background:var(--success)"></div><span class="chip" style="background:var(--success-soft);color:var(--success)">Job Completed</span><span class="n">Success</span></div>
  <div class="col"><div class="dot" style="background:var(--warning)"></div><span class="chip" style="background:var(--warning-soft);color:var(--warning)">Pending</span><span class="n">Warning</span></div>
  <div class="col"><div class="dot" style="background:var(--danger)"></div><span class="chip" style="background:var(--danger-soft);color:var(--danger)">Cancelled</span><span class="n">Danger</span></div>
  <div class="col"><div class="dot" style="background:var(--info)"></div><span class="chip" style="background:var(--info-soft);color:var(--info)">Info</span><span class="n">Info</span></div>
</div></body></html>
