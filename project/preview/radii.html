<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);}
  .card{padding:24px 28px;display:flex;gap:14px;align-items:flex-end;}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:56px;background:var(--bg-2);border:1px solid var(--border-2);
       box-shadow:var(--shadow-md);}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
</style></head>
<body><div class="card">
  <div class="col"><div class="box" style="border-radius:var(--r-xs)"></div><span class="lab">xs · 4</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-sm)"></div><span class="lab">sm · 6</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-md)"></div><span class="lab">md · 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-lg)"></div><span class="lab">lg · 14</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-xl)"></div><span class="lab">xl · 20</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-pill);width:56px;height:56px"></div><span class="lab">pill</span></div>
</div></body></html>
